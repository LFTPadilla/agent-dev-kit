profile: personal-dev-tutor
runtime: hermes
target: ~/.hermes/profiles/personal-dev-tutor/skills
sandbox_policy: trusted-development
role: tutor-orchestrator
workflow: gsd
model:
  provider: openai-codex
  default: gpt-5.6-sol
  configurable: true
pedagogy:
  default_mode: learning
  question_style: one-primary-question
  checkpoint: prediction-implementation-audit-teach-back
  mastery_states:
    - introduced
    - explained
    - applied
    - transferred
worker:
  worker_runtime: codex
  delegate_session: personal
  discovery: command-and-repository
  default_parallel_implementation_lanes: 1
workstation:
  default_execution: trusted-host
  network: allowed
  installed_tools: allowed
  configured_credentials: use-through-owning-tool-only
  offline_sandbox: opt-in-for-untrusted-or-explicit-offline-verification
context_intelligence:
  code_graph:
    provider: graphify
    package: graphifyy
    reviewed_version: 0.9.25
    default_mode: local-ast-code-only
    storage: user-cache-outside-worktree
    authority: advisory
  library_docs:
    provider: context7
    transport: streamable-http
    endpoint: https://mcp.context7.com/mcp
    authority: upstream-documentation-evidence
  command_output:
    provider: bounded-command-evidence
    helper: personal-tutor-output
    activation: opt-in-by-trigger
    storage: private-user-cache-outside-worktree
    successful_preview: bounded-with-exact-transcript
    failure_and_security_output: sanitized-and-bounded-at-32-kib
    authority: advisory
  verification_sandbox:
    provider: bubblewrap-offline-verification
    helper: personal-tutor-sandbox
    platform: linux
    activation: explicit-or-untrusted-code-only
    network: denied
    home: empty
    worktree: read-only-by-default
    explicit_write_paths: existing-relative-only
    git_metadata: always-read-only
    authority: defense-in-depth
diagrams:
  default: mermaid
  polished: d2
  keep_sources: true
include_skills:
  - tech-lead

  - diagram-render
  - drawio-skill
  - excel-xlsx

  - git-essentials
  - human-writing-style
  - image-finalize
  - improve
  - java-development
  - knip
  - live-qa
  - pdf
  - playwright-stability
  - security-checklist
  - semgrep
  - stagehand
  - tex-render
  - web-browse
  - word-docx
codex_worker_skills:
  - diagram-render
  - drawio-skill
  - excel-xlsx
  - git-essentials
  - human-writing-style
  - image-finalize
  - improve
  - java-development
  - knip
  - live-qa
  - pdf
  - playwright-stability
  - security-checklist
  - semgrep
  - stagehand
  - tex-render
  - web-browse
  - word-docx
external_skills:
  - graphify
  - caveman
  - ponytail
requires_gsd_skills:
  - gsd-new-project
  - gsd-discuss-phase
  - gsd-plan-phase
  - gsd-execute-phase
  - gsd-verify-work
  - gsd-progress
capabilities:
  - socratic-development-mentoring
  - cognitive-debt-detection
  - gsd-lifecycle-ownership
  - codex-tmux-delegation
  - independent-diff-and-test-verification
  - proactive-skill-routing
  - proactive-local-code-graph-navigation
  - current-library-documentation-retrieval
  - bounded-successful-command-output
  - optional-offline-read-only-verification-sandbox
  - mermaid-and-d2-diagrams
limits:
  production: explicit-only
  secrets: never-read-or-print
  private_documents_to_remote_models: explicit-only
  graphify_semantic_or_document_ingestion: explicit-only
  graphify_local_ast_extraction: allowed
  command_output_persistence: non-secret-only
  trusted_workstation_network: allowed
  configured_cli_credentials: use-through-owning-tool-only
  verification_sandbox_network: denied
  verification_sandbox_write_paths: explicit-only
  context_mode_package: not-installed
  git_push: explicit-only
  destructive_ops: explicit-only
  provider_config: explicit-only
  source_code_edit: delegate-only
  gsd_planning_state: named-gsd-skills-only
  compact_learning_doc: tutor-only
  direct_verification: allowed
  direct_commit: never
  direct_pr_open: never
notes:
  - "GSD owns project state and delivery flow; the mentor adds understanding gates without creating a second workflow."
  - "The profile is created without bundled skills and installs 19 public capabilities, excluding alternate orchestrators and dynamic skill discovery; it also links six GSD core workflow skills plus the pinned Graphify, caveman, and ponytail external skills."
  - "Graphify is an advisory local code-navigation layer, never a second lifecycle or planning authority; GSD remains authoritative."
  - "Context7 supplies current upstream library documentation to Hermes and Codex without replacing source inspection or test evidence."
  - "Command output is sanitized for display and bounded at 32 KiB by default; exact 0600 transcripts stay outside the worktree for local inspection."
  - "Normal development runs on the trusted workstation with network access and existing configured tools such as gh, git, package managers, Docker, and build wrappers; credentials are used through those tools and never read or printed directly."
  - "personal-tutor-sandbox is an optional exception for explicitly offline or untrusted-code verification; its limitations must never block routine development."
  - "Codex workers run in the configured tmux session (default personal) and are discovered by command and repository, never by a hard-coded window index."
  - "Mermaid is the default for maintainable documentation; D2 is used for polished or presentation-ready diagrams."
  - "One implementation lane is the default so parallelism does not hide the reasoning the developer is expected to learn."
