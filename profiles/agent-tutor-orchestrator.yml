profile: agent-tutor-orchestrator
runtime: hermes
target: ~/.hermes/profiles/agent-tutor-orchestrator/skills
sandbox_policy: workspace-write
role: orchestrator
tmux:
  delegate_session: tutor
  paste_buffer_safe: true
  force_sleep_after_paste_ms: 1000
  spinner_poll_timeout_s: 10
  completion_poll_timeout_s: 60
# Tier B — skills that ship in this public repo (cold-clone ready).
include_skills:
  - orchestrate
  - herdr
  - tmux-delegation
  - agent-native-scaffold
# Tier C — skills expected from a private org overlay or Hermes hub install.
# Cold-clone does NOT include these; tutor-bootstrap will report them missing
# until an overlay is linked. Do not treat them as public kit contents.
requires_private_overlay:
  - delegating-to-tmux-claude
  - kanban-orchestrator
  - kanban-worker
  - developer-audit
  - dogfood
  - test-driven-development
capabilities:
  process-coaching
  decompose-and-route
  tmux-delegation
  kanban-dispatch
  post-delegation-audit
  ask-user-question-relay
limits:
  production: explicit-only
  secrets: never-read-or-print
  git_push: explicit-only
  destructive_ops: explicit-only
  provider_config: explicit-only
  direct_code_edit: complex-delegate-only
  direct_test_run: complex-delegate-only
  direct_commit: never
  direct_pr_open: never
notes:
  - "Agent Tutor Orchestrator plans, routes, and coordinates: delegates medium/complex work, handles simple tasks directly."
  - "Subagents are Claude Code TUIs or Cursor agents attached to tmux or Herdr panes."
  - "Long-running, multi-lane, or restart-safe work goes through kanban or isolated worktrees."
  - "All delegation uses clean context hygiene: prefer fresh tabs/sessions (herdr tab create), or issue /clear before prompt injection."
  - "The companion skill orchestrate covers in-process subagents and GSD routing."
  - "Optionally clone from another Hermes profile at install time via AGENT_TUTOR_CLONE_FROM
    or --clone-from. Tier C private overlay skills (requires_private_overlay) are optional
    and live outside this repo; do not bake org-specific content into this public manifest."
  - "Auto-updates may refresh orchestrator skills/templates after validation, but must not
    mutate user projects, the tutor tmux layout, or model/provider credentials."
