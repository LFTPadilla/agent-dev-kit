<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#141024"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.45" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="640" fill="url(#accent)"/>

  <!-- decorative stack, right side: mirrors the hero diagram bands -->
  <g opacity="0.9">
    <rect x="880" y="96"  width="300" height="86" rx="14" fill="#2a1d07" stroke="#f59e0b" stroke-width="2"/>
    <text x="1030" y="146" fill="#fef3c7" font-size="26" text-anchor="middle">runtimes</text>

    <rect x="880" y="198" width="300" height="86" rx="14" fill="#111c31" stroke="#334155" stroke-width="2"/>
    <text x="1030" y="248" fill="#e2e8f0" font-size="26" text-anchor="middle">behavior</text>

    <rect x="880" y="300" width="300" height="86" rx="14" fill="#3b0764" stroke="#d8b4fe" stroke-width="3"/>
    <text x="1030" y="350" fill="#f5d0fe" font-size="26" text-anchor="middle">orchestration</text>

    <rect x="880" y="402" width="300" height="86" rx="14" fill="#082f36" stroke="#22d3ee" stroke-width="2"/>
    <text x="1030" y="452" fill="#cffafe" font-size="26" text-anchor="middle">context</text>

    <rect x="880" y="504" width="300" height="86" rx="14" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
    <text x="1030" y="554" fill="#d1fae5" font-size="26" text-anchor="middle">ship gates</text>
  </g>

  <!-- headline -->
  <text x="72" y="176" fill="#f1f5f9" font-size="82" font-weight="bold">agent-dev-kit</text>
  <text x="72" y="234" fill="#94a3b8" font-size="34">Systems engineering for coding agents</text>
  <text x="72" y="282" fill="#64748b" font-size="27">layered concerns · measurable gates · honest boundaries</text>

  <!-- stat chips -->
  <g font-size="25">
    <rect x="72"  y="330" width="176" height="60" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="160" y="369" fill="#e0e7ff" text-anchor="middle">22 skills</text>

    <rect x="264" y="330" width="196" height="60" rx="12" fill="#2a1d07" stroke="#f59e0b" stroke-width="2"/>
    <text x="362" y="369" fill="#fef3c7" text-anchor="middle">5 runtimes</text>

    <rect x="476" y="330" width="366" height="60" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
    <text x="659" y="369" fill="#d1fae5" text-anchor="middle">15 evals · 0 false positives</text>
  </g>

  <!-- tool ribbon -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#7c8ba1">
    <text x="72" y="464">Claude Code · Codex · Hermes · Pi · OpenCode</text>
    <text x="72" y="504">GSD · caveman · ponytail · hypa · Graphify · Context7</text>
    <text x="72" y="544">/pr-review · no-mistakes · semgrep · treehouse · gnhf</text>
  </g>

  <text x="72" y="596" fill="#475569" font-size="22">github.com/LFTPadilla/agent-dev-kit · MIT</text>
</svg>
