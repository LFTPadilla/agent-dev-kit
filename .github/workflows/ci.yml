name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: shellcheck (errors only)
        run: shellcheck -S error $(git ls-files '*.sh')

  evals:
    name: evals (semgrep floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - run: npm ci
      - run: npm run eval:semgrep
