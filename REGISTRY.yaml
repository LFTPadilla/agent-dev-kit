# REGISTRY.yaml — Canonical Machine-Readable Catalog for agent-dev-kit
# Standard: ANRS-1.0 (Agent-Native Repository Specification)
version: "1.0"
updated: "2026-09-13"

subsystems:
  dev-skills:
    path: "plugins/dev-skills"
    context: "plugins/dev-skills/AGENTS.md"
    description: "Curated discrete skills and plugin manifests for Claude Code & Codex"
  overnight-task-kit:
    path: "overnight-task-kit"
    context: "overnight-task-kit/AGENTS.md"
    description: "Long-running autonomous protocols, templates, and multi-harness delegation"

profiles:
  agent-tutor-orchestrator:
    path: "profiles/agent-tutor-orchestrator.yml"
    role: "Strict orchestrator and liaison"

skills:
  agent-native-scaffold:
    path: "plugins/dev-skills/skills/agent-native-scaffold"
    scope: "architecture"
    requires: [python3, git]
  orchestrate:
    path: "plugins/dev-skills/skills/orchestrate"
    scope: "orchestration"
  multi-harness:
    path: "overnight-task-kit/skills/multi-harness"
    scope: "cross-harness"
    requires: [python3]
  overnight-task:
    path: "overnight-task-kit/skills/overnight-task"
    scope: "autonomous"
  diagram-render:
    path: "plugins/dev-skills/skills/diagram-render"
    scope: "visualization"
  explain-concept:
    path: "plugins/dev-skills/skills/explain-concept"
    scope: "visualization"
    requires: [diagram-render, drawio-skill, explainer-video]
  explainer-video:
    path: "plugins/dev-skills/skills/explainer-video"
    scope: "visualization"
    requires: [node, ffmpeg]
  herdr:
    path: "plugins/dev-skills/skills/herdr"
    scope: "orchestration"
    requires: [herdr]
  tmux-delegation:
    path: "plugins/dev-skills/skills/tmux-delegation"
    scope: "orchestration"
    requires: [tmux]
  voice-studio:
    path: "plugins/dev-skills/skills/voice-studio"
    scope: "voice-synthesis"
    requires: [VoiceStudio, PipeWire]

tools:
  agent-dev-kit:
    entrypoint: "scripts/agent-dev-kit.mjs"
    commands: [doctor, validate, inventory]
  audit-agent-native:
    entrypoint: "scripts/audit-agent-native.py"
    commands: [audit]
  overnight-runner:
    entrypoint: "overnight-task-kit/scripts/overnight-runner.mjs"
    commands: [init]
  delegate:
    entrypoint: "overnight-task-kit/skills/multi-harness/scripts/delegate.py"
    description: "Multi-harness dispatcher with worker contract mode (--task-json: task.json in, result.json validated, events.jsonl appended)"
    commands: ["--task", "--task-file", "--task-json", "--worktree", "--dry-run", "--diagnose", "--list-profiles"]
