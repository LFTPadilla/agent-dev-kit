version: 2
scope: public-safe
status: research-only
runtime_activation: none
default_policy: read-only

authority:
  lifecycle: gsd
  context_and_orchestration: hermes
  bounded_implementation_worker: codex
  pi_role: advisory-only

profiles:
  pi-read-only-advisor:
    purpose: "Return a bounded second opinion with file and line evidence."
    packages: []
    sandbox_policy: read-only
    allowed:
      - inspect explicitly supplied public-safe repository files
      - propose verification commands
      - separate confirmed facts from hypotheses
    forbidden:
      - write files
      - read secrets or environment files
      - mutate git state
      - access production systems
      - create or delegate lifecycle state
    output_contract:
      - findings
      - confidence
      - evidence
      - test_gaps
      - proposed_next_steps

  pi-research-advisor:
    purpose: "Research public package or library sources without receiving project source."
    packages: []
    sandbox_policy: research-network
    allowed:
      - public web and package-registry research
      - source and license review in a disposable directory
      - version-specific comparison tables
    forbidden:
      - private source uploads
      - credentials or authenticated consoles
      - implicit package installation
      - package activation
    output_contract:
      - sources
      - reviewed_versions
      - evidence
      - risks
      - recommendations

  pi-browser-advisor:
    purpose: "Describe a disposable local or staging browser-QA task after explicit approval."
    packages: []
    sandbox_policy: browser-lab
    allowed:
      - local or dedicated staging targets
      - disposable screenshots and traces
    forbidden:
      - personal or customer authentication state
      - unattended third-party actions
      - production mutation
    output_contract:
      - scenario
      - failures
      - reproduction_steps
      - artifact_paths

package_gate:
  require_exact_version: true
  require_published_artifact_review: true
  require_source_commit_or_tag: true
  require_license_review: true
  require_dependency_and_install_hook_review: true
  require_filesystem_process_network_data_flow_review: true
  require_prompt_and_context_mutation_review: true
  require_disposable_workspace: true
  max_packages_per_pilot: 1
  default_network: false
  default_write_access: false
  default_recursive_delegation: false

notes:
  - "This file is agent-dev-kit policy metadata, not Pi settings and not an executable profile registry."
  - "No third-party Pi package is approved or activated by this repository."
