version: 2
scope: public-safe
status: opt-in-examples
runtime_activation: explicit-profile-selection
default_policy: read-only

authority:
  lifecycle: gsd
  context_and_orchestration: hermes
  bounded_implementation_worker: codex
  pi_role: advisory-only

profiles:
  pi-code-review:
    purpose: "Read-only code review with semantic navigation and false-positive control."
    packages:
      - npm:@bacnh85/pi-serena@0.9.2
      - npm:@bacnh85/pi-plan@0.6.2
      - npm:@braintrust/pi-extension@0.10.0
    runtime_activation: explicit-profile-selection
    sandbox_policy: read-only
    allowed:
      - inspect changed files
      - inspect nearby code
      - propose tests
    forbidden:
      - write files
      - run production commands
      - invent issues without file and line evidence
    output_contract:
      - findings
      - severity
      - file_refs
      - test_gaps
      - false_positive_notes

  pi-sre-research:
    purpose: "Current public documentation and package research for infrastructure or SDK questions."
    packages:
      - npm:pi-web-access@0.13.0
      - npm:pi-all-search@1.0.18
      - npm:context-mode@1.0.169
    runtime_activation: explicit-profile-selection
    sandbox_policy: research-network
    allowed:
      - public web research
      - package documentation review
      - comparison tables
    forbidden:
      - secrets
      - private source
      - customer data
      - authenticated production consoles
    output_contract:
      - sources
      - recommendations
      - risks
      - version_notes

  pi-read-only-advisor:
    purpose: "Return a bounded second opinion with file and line evidence."
    packages: []
    runtime_activation: metadata-only
    package_reason: "This policy-only advisor needs no extension package."
    sandbox_policy: read-only
    allowed:
      - inspect explicitly supplied public-safe repository files
      - propose verification commands
      - separate confirmed facts from hypotheses
    forbidden:
      - write files
      - read secrets or environment files
      - mutate git state
      - access production systems
      - create or delegate lifecycle state
    output_contract:
      - findings
      - confidence
      - evidence
      - test_gaps
      - proposed_next_steps

  pi-research-advisor:
    purpose: "Research public package or library sources without receiving project source."
    packages: []
    runtime_activation: metadata-only
    package_reason: "This policy-only advisor needs no extension package."
    sandbox_policy: research-network
    allowed:
      - public web and package-registry research
      - source and license review in a disposable directory
      - version-specific comparison tables
    forbidden:
      - private source uploads
      - credentials or authenticated consoles
      - implicit package installation
      - package activation
    output_contract:
      - sources
      - reviewed_versions
      - evidence
      - risks
      - recommendations

  pi-browser-advisor:
    purpose: "Describe a disposable local or staging browser-QA task after explicit approval."
    packages: []
    runtime_activation: metadata-only
    package_reason: "This policy-only advisor does not activate browser tooling."
    sandbox_policy: browser-lab
    allowed:
      - local or dedicated staging targets
      - disposable screenshots and traces
    forbidden:
      - personal or customer authentication state
      - unattended third-party actions
      - production mutation
    output_contract:
      - scenario
      - failures
      - reproduction_steps
      - artifact_paths

package_gate:
  require_exact_version: true
  require_published_artifact_review: true
  require_source_commit_or_tag: true
  require_license_review: true
  require_dependency_and_install_hook_review: true
  require_filesystem_process_network_data_flow_review: true
  require_prompt_and_context_mutation_review: true
  require_disposable_workspace: true
  max_packages_per_pilot: 1
  default_network: false
  default_write_access: false
  default_recursive_delegation: false

notes:
  - "This file is agent-dev-kit policy metadata, not Pi settings and not an executable profile registry."
  - "Pinned legacy examples remain available through explicit profile selection; no repository installer activates them."
